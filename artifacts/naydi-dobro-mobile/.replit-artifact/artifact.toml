kind = "mobile"
previewPath = "/mobile/"
title = "Найди добро"
description = "Мобильный прототип платформы для волонтёров Ставропольского края: просмотр и отклик на задания, демонстрационная карта и добавление заданий координатором."
version = "1.0.0"
id = "artifacts/naydi-dobro-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24250

[services.development]
run = "pnpm --filter @workspace/naydi-dobro-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/naydi-dobro-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/naydi-dobro-mobile", "run", "serve" ]

[services.env]
PORT = "24250"
BASE_PATH = "/mobile/"
